name: status-deploy
on:
  workflow_dispatch:
  push:
    tags: ["status-v*"]
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.19.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check
      - run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify public status canary
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            health="$(curl --silent --show-error --location --max-time 10 https://status.cheaply.fr/healthz || true)"
            api="$(curl --silent --show-error --location --max-time 10 https://status.cheaply.fr/api/status || true)"
            if printf '%s' "$health" | grep -q '"ok":true' && printf '%s' "$api" | grep -q '"applications"'; then
              printf 'Public status canary passed on attempt %s.\n' "$attempt"
              exit 0
            fi
            sleep 5
          done
          echo 'Public status canary failed: the custom domain did not expose the expected health and status contracts.' >&2
          exit 1
